name: Incus Remote Builder Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/incus-remote-builder-smoke.yml"
      - ".github/scripts/incus-remote-builder-smoke.sh"
      - "src/**"
      - "flake.nix"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  remote-builder-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Determinate Nix (enables KVM)
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          kvm: true

      - name: Install Incus and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y incus qemu-system-x86 jq curl

      - name: Ensure Incus daemon is running
        run: sudo systemctl enable --now incus

      - name: Run two-VM remote-builder smoke test
        id: smoke
        env:
          INCUS_BIN: "sudo incus"
          MONITOR_PORT: "8080"
        run: ./.github/scripts/incus-remote-builder-smoke.sh

      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incus-remote-builder-smoke
          path: artifacts
          if-no-files-found: ignore
